<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIRPORT RUSH - Don't Miss Your Flight!</title>
  <link rel="stylesheet" href="css/styles.css?v=panel-instructions">
  <link rel="stylesheet" href="css/security.css?v=security-completion-2">
  <script defer src="js/data.js?v=checkin20-reward2"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/ui.js?v=checkin20-reward2"></script>
  <script defer src="js/checkin.js?v=panel-instructions"></script>
  <script defer src="js/security-data.js"></script>
  <script defer src="js/security.js?v=security-completion-2"></script>
  <script defer src="js/app.js?v=security1"></script>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar">
      <div id="screen-hud" class="screen-hud"></div>
      <div class="hud-actions">
      <button type="button" class="hud-button" data-screen="home" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9"/></svg></button>
      <button type="button" id="audio-toggle" class="hud-button" aria-label="Audio settings" title="Audio settings" aria-expanded="false" aria-controls="audio-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
      <div id="audio-panel" class="audio-controls" aria-label="Audio settings" hidden>
        <div class="audio-channel">
          <label for="music-volume">MUSIC</label>
          <button type="button" class="mute-button" data-mute="music" aria-label="Mute music" aria-pressed="false" title="Mute music"><span aria-hidden="true">&#9835;</span></button>
          <input id="music-volume" aria-label="Music volume" type="range" min="0" max="1" step="0.01" value="0.10">
        </div>
        <div class="audio-channel">
          <label for="sfx-volume">SFX</label>
          <button type="button" class="mute-button" data-mute="sfx" aria-label="Mute SFX" aria-pressed="false" title="Mute SFX"><span aria-hidden="true">&#9834;</span></button>
          <input id="sfx-volume" aria-label="SFX volume" type="range" min="0" max="1" step="0.01" value="0.20">
        </div>
      </div>
      </div>
    </header>
    <main id="screen" class="stage" aria-label="Airport Rush"></main>
  </div>
</body>
</html>
